<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="登录研舟 ResearchDock，管理文献、核对证据、继续研究。">
  <title>登录 · 研舟 ResearchDock</title>
  <link rel="stylesheet" href="/login.css?v=20261116a">
  <script src="/login.js?v=20261116a" defer></script>
</head>
<body>
  <main class="login-layout">
    <section class="research-cover" aria-labelledby="cover-title">
      <a class="brand" href="/login" aria-label="研舟 ResearchDock 首页">
        <span class="brand-seal">研</span><span class="brand-name">研舟<small>RESEARCHDOCK</small></span>
      </a>
      <div class="cover-content">
        <p class="eyebrow"><span></span> YOUR RESEARCH, IN ONE PLACE</p>
        <h1 id="cover-title">读论文，<br>从这里开始<span class="title-dot">。</span></h1>
        <p class="cover-description">把文献、原文证据与研究思路，<br>整理在同一个工作台。</p>
        <div class="paper-art" aria-hidden="true">
          <svg viewBox="0 0 560 260" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="paper-fill" x1="208" y1="20" x2="390" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#FCFBF3"/><stop offset="1" stop-color="#D9E3D7"/></linearGradient></defs>
            <path d="M48 203H511M48 211H356" stroke="#AEC2A5" stroke-opacity=".19"/>
            <circle cx="414" cy="107" r="83" stroke="#AEC2A5" stroke-opacity=".2" stroke-dasharray="3 8"/>
            <path d="M87 177L146 115L208 144L275 74L353 102L424 49" stroke="#D9CB9D" stroke-opacity=".55"/>
            <g fill="#D9CB9D"><circle cx="87" cy="177" r="3"/><circle cx="146" cy="115" r="3"/><circle cx="424" cy="49" r="4"/></g>
            <g transform="translate(170 30) rotate(-11 110 102)"><rect x="0" y="0" width="186" height="211" rx="5" fill="#A9BCA4" fill-opacity=".23" stroke="#A9BCA4" stroke-opacity=".45"/></g>
            <g transform="translate(207 12) rotate(5 100 110)">
              <rect x="0" y="0" width="190" height="222" rx="5" fill="url(#paper-fill)"/>
              <path d="M21 28H77" stroke="#66816B" stroke-width="2"/>
              <path d="M21 45H157M21 55H144" stroke="#365E4D" stroke-width="5"/>
              <path d="M21 78H168M21 85H161M21 92H163M21 99H139M21 122H90M21 129H90M21 136H87M21 143H90M21 150H79M21 176H168M21 183H160M21 190H168M21 197H119" stroke="#819382" stroke-opacity=".6" stroke-width="2"/>
              <rect x="105" y="117" width="61" height="39" rx="2" fill="#D3DFCF"/>
              <path d="M113 146L126 132L137 140L157 123" stroke="#5C7D60" stroke-width="2"/>
              <circle cx="157" cy="123" r="3" fill="#5C7D60"/>
              <text x="89" y="214" fill="#819382" font-size="7" font-family="Georgia,serif">01</text>
            </g>
            <g transform="translate(357 162)"><rect width="155" height="48" rx="5" fill="#214D40" stroke="#9BB29C" stroke-opacity=".5"/><circle cx="20" cy="24" r="9" stroke="#D9CB9D"/><path d="M16 24L19 27L24 21" stroke="#D9CB9D" stroke-width="1.5" stroke-linecap="round"/><text x="39" y="28" fill="#E3E9D7" font-family="Microsoft YaHei,sans-serif" font-size="11">回到原文，核对证据</text></g>
            <text x="52" y="239" fill="#AEC2A5" fill-opacity=".55" font-family="Georgia,serif" font-size="10" letter-spacing="3">READ · TRACE · WRITE</text>
          </svg>
        </div>
        <div class="feature-line"><span><i>01</i> 管理文献</span><span><i>02</i> 查找证据</span><span><i>03</i> 整理写作</span></div>
      </div>
      <div class="cover-footer"><span>为每一次认真阅读</span><span class="footer-line"></span><span>研舟 · 科研工作台</span></div>
    </section>
    <section class="access-side" aria-labelledby="login-title">
      <div class="access-top"><span class="access-marker"></span> 研究空间</div>
      <div class="access-card">
        <span class="section-index">WELCOME BACK</span>
        <h2 id="login-title">欢迎回来</h2>
        <p class="login-intro">登录研舟，继续你的研究。</p>
        <form id="login-form" aria-label="账号登录">
          <div class="form-field"><label for="login-user">账号</label><div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg>
            <input id="login-user" name="username" type="text" placeholder="请输入访问账号" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="100" aria-describedby="login-feedback">
          </div></div>
          <div class="form-field"><label for="login-password">密码</label><div class="input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
            <input id="login-password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required maxlength="200" aria-describedby="login-feedback caps-lock">
            <button class="password-toggle" id="toggle-password" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button>
          </div></div>
          <p class="caps-lock" id="caps-lock" hidden>大写锁定已开启</p>
          <div class="feedback-slot"><p id="login-feedback" class="login-feedback" role="status" aria-live="polite"></p></div>
          <button class="login-submit" id="login-submit" type="submit"><span class="button-label">进入研究空间</span><svg class="submit-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg><span class="button-spinner" hidden aria-hidden="true"></span></button>
        </form>
        <div class="account-help"><span>第一次使用？</span><button type="button" id="account-help" aria-expanded="false" aria-controls="account-help-text">如何获取账号 <span aria-hidden="true">↗</span></button></div>
        <p class="help-text" id="account-help-text" hidden>请使用项目提供的访问账号。如需获取账号或重置密码，请联系项目负责人。</p>
        <div class="access-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></svg><span>你的文献与研究记录，登录后访问。</span></div>
        <noscript><p class="login-feedback">请启用浏览器 JavaScript 后登录。</p></noscript>
      </div>
      <footer class="access-footer"><span>研舟 ResearchDock</span><span>文献 · 阅读 · 研究</span></footer>
    </section>
  </main>
</body>
</html>
